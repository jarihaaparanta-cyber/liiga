# Julkaisee sivuston Cloudflareen. Käynnistyy kun branchiin tulee muutoksia,
# ja sen voi käynnistää myös käsin GitHubin käyttöliittymästä.
#
# Tarvittavat salaisuudet (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflaren API-tunniste
#   CLOUDFLARE_ACCOUNT_ID  Tilin tunniste
#   ADMIN_TOKEN            Itse keksitty salasana käsin käynnistettävälle haulle
#
# Tietokantaa ei tarvitse luoda käsin: työnkulku luo sen ensimmäisellä
# ajokerralla ja käyttää sen jälkeen samaa.

name: Julkaise

on:
  push:
    branches: [claude/liigaporssi-sm-liiga-jeafv2, main]
  workflow_dispatch:

concurrency:
  group: julkaise
  cancel-in-progress: false

jobs:
  julkaise:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Tarkista tyypit ja testit
        run: |
          npm run typecheck
          npm test

      - name: Varmista tietokanta
        run: node scripts/ensure-d1.mjs

      - name: Aja migraatiot
        run: npx wrangler d1 migrations apply liigaporssi --remote

      - name: Aseta ADMIN_TOKEN
        run: printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Julkaise
        id: julkaise
        run: |
          npx wrangler deploy | tee deploy.log
          # Poimi osoite julkaisun tulosteesta seuraavaa vaihetta varten.
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Sivusto: ${url:-osoitetta ei löytynyt tulosteesta}"

      - name: Hae kauden tiedot
        if: steps.julkaise.outputs.url != ''
        run: |
          # Tyhjä tietokanta täytetään koko kaudelta; myöhemmillä ajoilla
          # tämä on kevyt päivitys.
          curl --fail --silent --show-error --max-time 120 \
            -X POST "${{ steps.julkaise.outputs.url }}/api/sync?kind=manual" \
            -H "Authorization: Bearer $ADMIN_TOKEN"
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Yhteenveto
        run: |
          {
            echo "### Sivusto julkaistu"
            echo ""
            echo "${{ steps.julkaise.outputs.url || 'Osoite ei löytynyt tulosteesta — katso Julkaise-vaiheen loki.' }}"
          } >> "$GITHUB_STEP_SUMMARY"

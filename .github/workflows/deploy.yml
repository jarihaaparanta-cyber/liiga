# Julkaisee sivuston Cloudflareen. Käynnistyy kun branchiin tulee muutoksia,
# ja sen voi käynnistää myös käsin GitHubin käyttöliittymästä.
#
# Tarvittavat salaisuudet (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Cloudflaren API-tunniste
#   CLOUDFLARE_ACCOUNT_ID  Tilin tunniste
#   ADMIN_TOKEN            Itse keksitty salasana käsin käynnistettävälle haulle
#
# Tietokantaa ei tarvitse luoda käsin: työnkulku luo sen ensimmäisellä
# ajokerralla ja käyttää sen jälkeen samaa.

name: Julkaise

on:
  push:
    branches: [claude/liigaporssi-sm-liiga-jeafv2, main]
  workflow_dispatch:

concurrency:
  group: julkaise
  cancel-in-progress: false

jobs:
  julkaise:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Tarkista tyypit ja testit
        run: |
          npm run typecheck
          npm test

      - name: Varmista tietokanta
        run: node scripts/ensure-d1.mjs

      - name: Aja migraatiot
        run: npx wrangler d1 migrations apply liigaporssi --remote

      - name: Aseta ADMIN_TOKEN
        run: printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      # Ensimmäisellä julkaisulla wrangler voi kaatua workers.dev-osoitteen
      # kytkemiseen ("This Worker does not exist on your account"), koska juuri
      # luotu Worker ei ole vielä näkyvissä API:lle. Itse julkaisu on siinä
      # vaiheessa jo mennyt läpi, joten yritetään kerran uudelleen.
      - name: Julkaise
        run: npx wrangler deploy || npx wrangler deploy

      # Osoitetta ei poimita tulosteesta vaan kysytään API:lta. Tulosteen
      # muotoiluun ei voi luottaa, ja epäonnistunut poiminta ohitti aiemmin
      # koko datan haun huomaamatta.
      - name: Selvitä osoite
        id: osoite
        run: |
          set -o pipefail
          sub=$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result?.subdomain ?? ""))')
          if [ -z "$sub" ]; then
            echo "Tilille ei ole määritetty workers.dev-aliosoitetta." >&2
            exit 1
          fi
          echo "url=https://liigaporssi.$sub.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Hae kauden tiedot
        run: |
          # Tyhjä tietokanta täytetään koko kaudelta; myöhemmillä ajoilla
          # tämä on kevyt päivitys.
          curl --fail --silent --show-error --max-time 180 \
            -X POST "${{ steps.osoite.outputs.url }}/api/sync?kind=manual" \
            -H "Authorization: Bearer $ADMIN_TOKEN"
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Yhteenveto
        run: |
          {
            echo "### Sivusto julkaistu"
            echo ""
            echo "${{ steps.osoite.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

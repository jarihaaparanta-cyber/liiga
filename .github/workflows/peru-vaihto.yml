# Peruu joukkueen tekemän vaihdon.
#
# Pelaajat eivät voi perua vaihtoa sivustolta — se on sääntö. Tämä on
# ylläpitäjän korjauskeino väärinklikkauksiin ja testaamiseen, ja sen
# ajaminen vaatii pääsyn tähän repositorioon.
#
# Pisteet lasketaan aina vaihtohistoriasta uudelleen, joten rivin poisto
# palauttaa tilanteen täsmälleen ennalleen. Mitään ei häviä.

name: Peru vaihto

on:
  workflow_dispatch:
    inputs:
      joukkue:
        description: Joukkue
        required: true
        type: choice
        options: [apa, jarde, borje, niksu]
      positio:
        description: Mikä vaihto perutaan
        required: true
        type: choice
        options:
          - hyokkaaja
          - pakki
          - molemmat
      vahvistus:
        description: Kirjoita PERUUTA vahvistaaksesi
        required: true
        type: string

jobs:
  peru:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Tarkista vahvistus
        run: |
          if [ "${{ inputs.vahvistus }}" != "PERUUTA" ]; then
            echo "Vahvistus puuttuu. Kirjoita kenttään PERUUTA." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Poista vaihto
        run: |
          case "$POSITIO" in
            hyokkaaja) ehto="AND position = 'F'" ;;
            pakki)     ehto="AND position = 'D'" ;;
            molemmat)  ehto="" ;;
          esac
          node scripts/ensure-d1.mjs
          npx wrangler d1 execute liigaporssi --remote \
            --command "DELETE FROM swaps WHERE team_id = '$JOUKKUE' $ehto;"
          echo "Joukkueen $JOUKKUE vaihto ($POSITIO) peruttu." >> "$GITHUB_STEP_SUMMARY"
        env:
          JOUKKUE: ${{ inputs.joukkue }}
          POSITIO: ${{ inputs.positio }}
